<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />

      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
    />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="library-text">
        <div class="text">
          <h1>My Library</h1>
          <p>Keep track of the books you want to read.</p>
        </div>
        <dialog id="bookDialog">
          <form method="dialog" class="book-form">
            <h2>Add a new book</h2>

            <div class="form-group">
              <label for="title">Title</label>
              <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter book title"
                required
              />
            </div>

            <div class="form-group">
              <label for="author">Author</label>
              <input
                type="text"
                id="author"
                name="author"
                placeholder="Enter author name"
                required
              />
            </div>

            <div class="form-group">
              <label for="pages">Pages</label>
              <input
                type="number"
                id="pages"
                name="pages"
                placeholder="Enter number of pages"
                min="1"
                required
              />
            </div>

            <div class="form-group">
              <label for="imgUrl">Cover image URL</label>
              <input
                type="url"
                id="imgUrl"
                name="imgUrl"
                placeholder="https://example.com/book.jpg"
                required
              />
            </div>

            <div class="form-group">
              <label for="isRead">Have you read it?</label>

              <select id="isRead" name="isRead" required>
                <option value="" disabled selected>Select an option</option>
                <option value="true">Yes</option>
                <option value="false">No</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="button" id="cancelBook">Cancel</button>
              <button type="submit">Add Book</button>
            </div>
          </form>
        </dialog>

        <button id="addBook">
          <span class="mdi mdi-plus"></span> Add Book
        </button>
      </div>
